name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/web/package.json
      - name: Install dependencies
        working-directory: ./apps/web
        run: npm ci
      - name: Build and Type Check
        working-directory: ./apps/web
        run: npm run build

  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/api/package.json
      - name: Install dependencies
        working-directory: ./apps/api
        run: npm ci
      - name: Generate Prisma Client
        working-directory: ./apps/api
        run: npx prisma generate
      - name: Type Check & Build
        working-directory: ./apps/api
        run: npm run build

  test-ai-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: ./apps/ai-service
        run: pip install -r requirements.txt
      - name: Run RAG Unit Tests
        run: python tests/test_rag.py
      - name: Run Benchmark Evaluation
        run: python tests/eval/run_eval.py

  docker-build:
    runs-on: ubuntu-latest
    needs: [test-frontend, test-backend, test-ai-service]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Validate Docker Compose Config
        run: docker compose config
